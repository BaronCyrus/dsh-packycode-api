name: Publish

on:
  push:
    tags:
      - 'v*'
  # Tags publish straight to `latest`. 1.3.3 and 1.3.4 were staged on `next`
  # first; this schedule only lets the promote job move `latest` to them once
  # each is past the release-age window DSH's pnpm enforces. Remove it, the
  # promote and mark-latest jobs and scripts/promote-release.mjs once `latest`
  # is 1.3.4 or newer.
  # GitHub runs a schedule as the account that last committed a change to the
  # cron value and runs nothing if that commit's email is linked to no account,
  # so change it only from a linked address. `*/1` means `*`; it was rewritten
  # for that reason.
  schedule:
    - cron: '41 */1 * * *'
  workflow_dispatch:
    inputs:
      promote:
        description: Promote a matured next version to latest instead of printing the OIDC identity
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish to npm
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.promote)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - name: Require an npm CLI that can use trusted publishing
        run: |
          node <<'EOF'
          const { execSync } = require('node:child_process')
          const version = () => execSync('npm --version', { encoding: 'utf8' }).trim()
          const supports = value => {
            const [major, minor, patch] = value.split('.').map(Number)
            return major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)))
          }
          if (!supports(version())) {
            execSync('npm install -g npm@11', { stdio: 'inherit' })
          }
          const current = version()
          if (!supports(current)) {
            console.error(`npm ${current} cannot publish with a trusted publisher`)
            process.exit(1)
          }
          console.log(`npm ${current}`)
          EOF
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Refuse a tag that does not match package.json
        if: github.event_name != 'workflow_dispatch'
        run: |
          node <<'EOF'
          const version = require('./package.json').version
          const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '')
          if (version !== tag) {
            console.error(`tag v${tag} does not match package.json ${version}`)
            process.exit(1)
          }
          EOF
      # Checked before npm publishes, so a version never reaches npm without
      # the notes its GitHub Release is created from.
      - name: Refuse a tag without its GitHub Release notes
        if: github.event_name != 'workflow_dispatch'
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > /dev/null
      - name: Test
        if: github.event_name != 'workflow_dispatch'
        run: pnpm run test
      - name: Verify committed lib/ matches a fresh build of src/
        if: github.event_name != 'workflow_dispatch'
        run: |
          pnpm run build
          git diff --exit-code -- lib
      - name: Package the verified release artifact
        if: github.event_name != 'workflow_dispatch'
        run: pnpm pack --pack-destination .artifacts
      - name: Show the OIDC identity npm will match
        if: github.event_name == 'workflow_dispatch'
        run: |
          node <<'EOF'
          async function main() {
          const audience = 'npm:registry.npmjs.org'
          const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL)
          url.searchParams.set('audience', audience)
          const response = await fetch(url, {
            headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
          })
          const body = await response.json()
          if (!response.ok || !body.value) {
            console.error('GitHub did not return an OIDC token', response.status)
            process.exit(1)
          }
          const payload = JSON.parse(Buffer.from(body.value.split('.')[1], 'base64url').toString())
          const claims = ['repository','repository_owner','workflow','workflow_ref','job_workflow_ref','ref','environment','repository_visibility','aud','iss']
          for (const key of claims) console.log(`${key}=${payload[key] ?? ''}`)
          const exchange = await fetch('https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/dsh-packycode-api', {
            method: 'POST',
            headers: { Authorization: `Bearer ${body.value}` },
          })
          // Never print the exchange body: truncation can cut off a token's
          // closing quote before a redaction regex sees it.
          await exchange.arrayBuffer()
          console.log(`exchange_status=${exchange.status}`)
          if (!exchange.ok) {
            console.error('npm rejected the trusted publisher; verify repository, workflow filename and environment before tagging')
            process.exit(1)
          }
          }
          main()
          EOF
      - name: Publish
        if: github.event_name != 'workflow_dispatch'
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "GitHub did not provide an OIDC token request URL"
            exit 1
          fi
          # Do not set NODE_AUTH_TOKEN at all, even to an empty string.
          # npm treats a present token variable as token auth and skips OIDC.
          unset NODE_AUTH_TOKEN
          version="$(node -p "require('./package.json').version")"
          artifact=".artifacts/dsh-packycode-api-${version:?}.tgz"
          if [ ! -f "$artifact" ]; then
            echo "The verified release artifact is missing"
            exit 1
          fi
          # Straight to `latest`. Update buttons up to 1.3.2 still install
          # whatever `latest` names past pnpm's minimumReleaseAge, and a profile
          # that then holds a version younger than that refuses every later
          # plugin install, so releases stay at least 24 hours apart while
          # users remain on them (AGENTS.md, Release cadence).
          npm publish "${artifact:?}" --access public
      - name: Hand the published tarball to the release job
        if: github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: published-tarball
          path: .artifacts/dsh-packycode-api-*.tgz
          # upload-artifact@v4 skips anything under a dot directory unless
          # told otherwise; the glob matches only the published tarball.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create the GitHub Release
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that may write to the repository. It runs no dependency
    # code: checkout, Node's built-ins, the published tarball and the
    # runner's gh.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: actions/download-artifact@v4
        with:
          name: published-tarball
          path: .artifacts
      - name: Create the release with the tarball npm published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          artifact=".artifacts/dsh-packycode-api-${version:?}.tgz"
          if [ ! -f "$artifact" ]; then
            echo "The published tarball is missing"
            exit 1
          fi
          echo "integrity sha512-$(openssl dgst -sha512 -binary "$artifact" | base64 -w0)"
          # A release made by hand is left as it is; a re-run must not fail on it.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it unchanged"
            exit 0
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          title="$(node scripts/release-notes.mjs "$version" --body-file "$notes")"
          # npm's `latest` names this version from now on, and so does Latest here.
          gh release create "$GITHUB_REF_NAME" "$artifact" --verify-tag --latest --title "$title" --notes-file "$notes"

  promote:
    name: Promote a matured release to latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.promote)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Transitional: moves `latest` to 1.3.3 and then 1.3.4, staged on `next`
    # before tags published to `latest`, once each is 25 hours old; after that
    # `next` is never newer than `latest` and it does nothing.
    # Reads public registry metadata and moves one dist-tag with the OIDC
    # identity; it installs no dependencies. The trusted publisher for this
    # workflow must allow npm dist-tag.
    outputs:
      version: ${{ steps.promote.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Require an npm CLI that can move dist-tags with trusted publishing
        run: |
          node <<'EOF'
          const { execSync } = require('node:child_process')
          const version = () => execSync('npm --version', { encoding: 'utf8' }).trim()
          // OIDC dist-tag operations need npm 11.21.0+ on 11.x, or 12.2.0+.
          const supports = value => {
            const [major, minor] = value.split('.').map(Number)
            return major > 12 || (major === 12 && minor >= 2) || (major === 11 && minor >= 21)
          }
          if (!supports(version())) {
            execSync('npm install -g npm@11', { stdio: 'inherit' })
          }
          const current = version()
          if (!supports(current)) {
            console.error(`npm ${current} cannot move dist-tags with a trusted publisher`)
            process.exit(1)
          }
          console.log(`npm ${current}`)
          EOF
      - name: Move latest to next once it is past the release-age window
        id: promote
        run: |
          # npm treats a present token variable as token auth and skips OIDC.
          unset NODE_AUTH_TOKEN
          node scripts/promote-release.mjs

  mark-latest:
    name: Mark the promoted GitHub Release as latest
    needs: promote
    if: needs.promote.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Mark the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.promote.outputs.version }}
        run: gh release edit "v${VERSION:?}" --latest
